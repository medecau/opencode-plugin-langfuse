name: CD

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Verify tag is signed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REF=$(gh api "repos/$GITHUB_REPOSITORY/git/refs/tags/$GITHUB_REF_NAME")
          OBJECT_TYPE=$(jq -r .object.type <<<"$REF")
          OBJECT_SHA=$(jq -r .object.sha <<<"$REF")
          if [ "$OBJECT_TYPE" != "tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME is lightweight (object type: $OBJECT_TYPE). Releases require an annotated, signed tag — recreate with: git tag -s $GITHUB_REF_NAME -m \"Release $GITHUB_REF_NAME\""
            exit 1
          fi
          VERIFICATION=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$OBJECT_SHA" --jq .verification)
          VERIFIED=$(jq -r .verified <<<"$VERIFICATION")
          REASON=$(jq -r .reason <<<"$VERIFICATION")
          if [ "$VERIFIED" != "true" ]; then
            echo "::error::Tag $GITHUB_REF_NAME failed signature verification (reason: $REASON). Recreate with: git tag -s $GITHUB_REF_NAME -m \"Release $GITHUB_REF_NAME\""
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME verified by GitHub (reason: $REASON)."
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - name: Sync package.json version to tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          bunx npm version "$VERSION" --no-git-tag-version --allow-same-version
      - run: bunx npm publish --provenance --access public
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
